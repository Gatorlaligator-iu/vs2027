# Sources surveillées par le tracker.
# type: workday  -> URL publique d'un portail Workday (https://<tenant>.wdN.myworkdayjobs.com/<site>)
# type: html     -> page web dont on lit les liens ; motif_lien = morceau d'URL propre aux offres
# statut: "confirmé" = URL vérifiée ; "à vérifier" = bonne piste, le premier passage dira si ça marche
#
# Pour ajouter un cabinet : copie un bloc, change entreprise / type / url, pousse le fichier.

filtres:
  # L'intitulé (ou le lieu) doit contenir au moins un de ces termes
  type_poste:
    - "\\bintern(s|ship|ships)?\\b"
    - "\\bstage\\b"
    - "stagiaire"
    - "praktik"
    - "tirocinio"
    - "off[- ]cycle"
    - "graduate"
    - "analyst program"
  # Si le lieu est connu, il doit contenir un de ces termes
  lieux:
    - "paris"
    - "france"
    - "lyon"
    - "munich"
    - "münchen"
    - "milan"
    - "milano"
    - "london"
    - "londres"
    - "berlin"
    - "new york"
    - "nyc"
  # L'intitulé (ou l'URL) doit évoquer un de tes métiers
  metier:
    - "m&a"
    - "merger"
    - "restructur"
    - "debt"
    - "dette"
    - "advisory"
    - "capital solutions"
    - "corporate finance"
    - "private equity"
    - "capital[- ]investissement"
    - "investment banking"
    - "banque d'affaires"
    - "strateg"
    - "stratég"
    - "consult"
    - "valuation"
    - "transaction"
    - "turnaround"
    - "retournement"
    - "special situations"
    - "lbo"
    - "buyout"
    - "sovereign"
    - "infra"
    - "energ"
    - "renewable"
    - "renouvelable"
    - "power"
    - "utilities"
    - "investment"
    - "investissement"
  # On écarte ces formats
  exclure:
    # Démarrages hors fenêtre (avant juillet 2027) quand la date figure dans l'intitulé
    - "(?<![0-9])2026(?![0-9])"                    # toute offre datée 2026
    - "(may|mai|june|juin)[ -]*2027"               # mai / juin 2027 (hors fenêtre)
    - "(january|janvier|february|février|fevrier|march|mars|april|avril)[ -]*2027"
    - "\\b(jan|feb|mar|apr)[ .-]*2027"
    - "\\b(q1|q2|h1|s1)[ -]*2027"
    - "2027[ -]*(q1|q2|h1|s1)\\b"
    - "summer intern"
    - "summer[ -]*20(26|27)"
    - "20(26|27)[ -]*summer"
    - "summer analyst"
    - "cyber"
    - "compliance"
    - "conformit"
    - "forensic"
    - "communications"
    - "public affairs"
    - "polytechnique"
    - "networking"
    - "meet-up"
    - "aperitivo"
    - "data scien"
    - "data engineer"
    - "marketing"
    - "design"
    - "human resources"
    - "recrutement"
    - "talent acquisition"
    - "spring week"
    - "insight"
    - "alternance"
    - "apprenti"
    - "werkstudent"

