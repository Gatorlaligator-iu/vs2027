name: Veille stages

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # toutes les 10 min, décalé des heures pile (moins de retards GitHub)
  workflow_dispatch:        # bouton "Run workflow" pour lancer à la main
  push:                     # relance dès qu'on modifie les sources ou le script
    branches: [main]
    paths: ["sources.yaml", "tracker.py", ".github/workflows/veille.yml"]

permissions:
  contents: write   # pour enregistrer la liste des offres déjà vues
  issues: write     # pour ouvrir une issue par nouvelle offre

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    # GitHub ne lance le cron qu'environ une fois par heure : chaque exécution
    # fait donc elle-même un passage toutes les 10 min pendant ~5 h 40.
    # Les exécutions suivantes attendent leur tour (concurrency) et prennent le relais.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Créer les labels (une fois)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create nouvelle-offre --color 2DA44E --description "Nouvelle offre détectée" 2>/dev/null || true
          gh label create initialisation --color 0969DA --description "Premier passage" 2>/dev/null || true

      - name: Veille toutes les 10 min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DUREE_MAX: "20400"   # 5 h 40
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          fin=$((SECONDS + DUREE_MAX))
          while true; do
            debut=$SECONDS
            git pull --rebase -q origin main || true
            echo "## Passage $(date -u '+%H:%M') UTC" >> "$GITHUB_STEP_SUMMARY"
            python tracker.py | tee -a "$GITHUB_STEP_SUMMARY" || echo "passage en échec, on continue"
            git add state/seen.json state/etat_des_sources.md
            if ! git diff --cached --quiet; then
              git commit -q -m "Veille : mise à jour des offres vues"
              for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q && break; echo "push échoué, nouvel essai dans 20 s"; sleep 20; done
            fi
            attente=$((600 - (SECONDS - debut)))
            [ $((SECONDS + attente)) -ge $fin ] && break
            [ $attente -gt 0 ] && sleep $attente
          done
