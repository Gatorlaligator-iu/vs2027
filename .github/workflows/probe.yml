name: Diagnostic des sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["probe.py", ".github/workflows/probe.yml"]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python probe.py | tee -a "$GITHUB_STEP_SUMMARY"
